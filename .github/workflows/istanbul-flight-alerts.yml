name: Istanbul Flight Alerts
on:
  push:
    paths:
      - 'istanbul-flight-alerts/**'
      - '.github/workflows/istanbul-flight-alerts.yml'
  schedule:
    # Approximate Istanbul local times 04:17 / 10:17 / 16:17 / 22:17
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: istanbul-flight-alerts
  cancel-in-progress: false
jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ABSOLUTE_PRICE_TRY: ${{ vars.ABSOLUTE_PRICE_TRY || '5000' }}
      DROP_PERCENT: ${{ vars.DROP_PERCENT || '30' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: istanbul-flight-alerts
        run: python -m unittest discover -s tests -v
      - name: Verify required integrations
        id: config
        shell: bash
        run: |
          if [[ -n "$TRAVELPAYOUTS_TOKEN" && -n "$SMTP_HOST" && -n "$SMTP_USER" && -n "$SMTP_PASSWORD" && -n "$ALERT_TO" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '## Flight scan not activated' >> "$GITHUB_STEP_SUMMARY"
            echo 'Travelpayouts API and SMTP Secrets must be configured for live alerts.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Scan cached fares and email critical price drops
        if: steps.config.outputs.ready == 'true'
        working-directory: istanbul-flight-alerts
        run: python flight_alerts.py scan
      - name: Save non-sensitive quote history
        if: steps.config.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add istanbul-flight-alerts/data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: flight price history [skip ci]'
            git push
          fi
